# 사내·온프렘에 따로 띄운 OpenAI 호환 서버(vLLM·TGI·LM Studio 등)를 여는 프리셋.
# 주소가 환경마다 다르므로 .env의 VLLM_API_BASE로 준다.
#
# **이 파일은 프리셋이다.** 구성을 바꾸고 싶으면 파일을 고치지 말고 .env의 LITELLM_CONFIG_FILE로
# 다른 프리셋을 가리킨다 — 추적 파일을 고치면 다음 git pull이 충돌한다.
#
#   config/litellm_config.yaml          기본 — Gemini 하나            LLM_API_KEY
#   config/litellm_config_multi.yaml    Gemini·Claude·OpenAI 셋       공급자별 키 3개
#   config/litellm_config_ollama.yaml   내 PC에서 돌리는 Ollama       OLLAMA_API_BASE
#   config/litellm_config_vllm.yaml     온프렘 vLLM 등 호환 서버      VLLM_API_BASE
#
# model_name은 대외 이름(별칭)이다 — 이 이름이 채팅 화면의 모델 선택 목록에 그대로 뜨고
# BFF도 이 이름으로 게이트웨이를 부른다. 그러니 사람이 읽을 이름으로 짓는다.
# 목록의 **맨 위 항목이 화면의 기본 선택**이다.
#
# 서빙 중인 모델 이름도 환경마다 다르다 — model_name·model 두 줄을 그 이름으로 바꾼다.
#   확인: curl $VLLM_API_BASE/models
#
# 서버가 키를 요구한다면(vLLM의 --api-key 등) api_key를 os.environ/LLM_API_KEY로 바꾸고
# .env에 그 값을 넣는다.
model_list:
  - model_name: gemma
    litellm_params:
      model: openai/gemma
      api_base: os.environ/VLLM_API_BASE
      api_key: none

router_settings:
  routing_strategy: simple-shuffle
  redis_host: redis
  redis_port: 6379
  num_retries: 3
  timeout: 300

litellm_settings:
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    ttl: 3600
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
